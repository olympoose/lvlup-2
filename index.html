:root{--surface-0:#F7F6F2;--surface-1:#EFEDE6;--surface-2:#FFFFFF;--text-primary:#1F1E1C;--text-secondary:#5F5E5A;--text-muted:#9A988F;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15);--border-stronger:rgba(0,0,0,.4);--track:rgba(127,119,221,.16);--bg-accent:#E6F1FB;--text-accent:#185FA5;--border-accent:#85B7EB;--bg-success:#EAF3DE;--text-success:#3B6D11;--border-success:#97C459;--fill-success:#639922;--on-success:#fff;--bg-warning:#FAEEDA;--text-warning:#854F0B;--border-warning:#EF9F27;--bg-danger:#FCEBEB;--text-danger:#A32D2D;--border-danger:#F09595;--fill-primary:#1F1E1C;--on-primary:#fff;--purple:#7F77DD;--bg-purple:#EEEDFE;--text-purple:#3C3489;--gold:#EF9F27;--radius:10px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;--font-voice:Georgia,"Times New Roman",serif;--font-mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--surface-0:#141413;--surface-1:#252523;--surface-2:#1D1D1B;--text-primary:#F1EFE8;--text-secondary:#B4B2A9;--text-muted:#7D7B74;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);--border-stronger:rgba(255,255,255,.45);--track:rgba(127,119,221,.22);--bg-accent:#0C447C;--text-accent:#B5D4F4;--border-accent:#378ADD;--bg-success:#27500A;--text-success:#C0DD97;--border-success:#639922;--fill-success:#97C459;--on-success:#173404;--bg-warning:#633806;--text-warning:#FAC775;--border-warning:#BA7517;--bg-danger:#501313;--text-danger:#F09595;--border-danger:#A32D2D;--fill-primary:#F1EFE8;--on-primary:#141413;--bg-purple:#26215C;--text-purple:#CECBF6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{position:relative;max-width:480px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom))}
button,.btn{font:inherit;font-size:14px;height:40px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s}
button:active,.btn:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:16px;width:100%;height:42px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--border-accent);box-shadow:0 0 0 3px var(--bg-accent)}
textarea{height:auto;padding:10px 12px;resize:vertical}
input[type=range]{height:auto;padding:0;border:none;background:transparent;accent-color:var(--purple);box-shadow:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--purple)}
a{color:var(--text-accent)}
.px{font-family:'Pixelify Sans',var(--font-mono);font-weight:500;letter-spacing:.3px}
.top{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -14px 10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--surface-0) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.flat{background:var(--surface-1);border:none;box-shadow:none}
.mc{background:var(--surface-1);border-radius:12px;padding:12px;border:none;text-align:left;width:100%;height:auto;display:block;color:var(--text-primary)}
.lbl{font-size:12px;color:var(--text-secondary);line-height:1.45}
.h{font-size:16px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sb{justify-content:space-between}
.f1{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(460px,calc(100% - 16px));z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.nav button,.seg button{border:none;background:transparent;color:var(--text-secondary);height:auto}
.nav button{padding:7px 0;flex-direction:column;gap:2px;font-size:10.5px;border-radius:15px}
.nav button i{font-size:21px}
.nav button.on{background:var(--bg-accent);color:var(--text-accent)}
.seg{display:flex;gap:2px;background:var(--surface-1);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:8px 1px;font-size:12.5px;border-radius:9px;min-width:0;white-space:nowrap}
.seg button.on{background:var(--surface-2);color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.li:first-of-type,.li.nb{border-top:none}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--bg-accent);color:var(--text-accent);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.s{background:var(--bg-success);color:var(--text-success)}
.pill.w{background:var(--bg-warning);color:var(--text-warning)}
.pill.d{background:var(--bg-danger);color:var(--text-danger)}
.pill.p{background:var(--bg-purple);color:var(--text-purple)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .8s ease}
.ib{width:38px;height:38px;padding:0;flex:none}
.chk{width:30px;height:30px;padding:0;border-radius:8px;flex:none;color:var(--text-muted)}
.chk.on{background:var(--fill-success);border-color:transparent;color:var(--on-success);animation:pop .3s}
.pri{background:var(--fill-primary)!important;color:var(--on-primary)!important;border-color:transparent!important}
.acc{background:var(--purple)!important;color:#fff!important;border-color:transparent!important}
.chip{font-size:13px;height:32px;padding:0 12px;border-radius:999px}
.chip.sm{height:28px;font-size:12px;padding:0 10px}
.chip.on{background:var(--bg-purple);color:var(--text-purple);border-color:var(--purple)}
.danger{color:var(--text-danger)}
.view{animation:fin .35s ease}
.bob{animation:bob 1.6s ease-in-out infinite}
.hero span{display:inline-block;line-height:0}.hero .fa{display:none}.hero.alt .fb{display:none}.hero.alt .fa{display:inline-block}
.xpf{position:absolute;z-index:25;pointer-events:none;font-size:16px;color:var(--text-success);animation:up 1.3s ease-out both;white-space:nowrap}
.xpf.coin{color:#BA7517}
.brc{width:150px;height:150px;border-radius:50%;background:var(--bg-accent);border:2px solid var(--border-accent);transform:scale(.55)}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.4s ease forwards}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fill-primary);color:var(--on-primary);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;animation:tin .3s ease;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.acc-b{border:none;background:transparent;padding:0;height:auto;display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;gap:8px}
.tag{font-size:13px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--border-strong);background:transparent}
.tag.on{background:var(--bg-purple);color:var(--text-purple);border-color:var(--purple)}
.note{font-size:13px;line-height:1.55;color:var(--text-secondary)}
.big{font-size:22px}
/* hero stage */
.stage{position:relative;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;background:var(--surface-1)}
.stage .hero{position:relative;z-index:2;cursor:pointer}
.stage .pet{position:absolute;z-index:3;bottom:8%;right:7%;animation:bob 1.2s ease-in-out infinite .3s}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:12%;z-index:1}
.stage .aura{position:absolute;z-index:1;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);border-radius:50%;filter:blur(10px);opacity:.75;animation:pulse 2.2s ease-in-out infinite}
.stage .pt{position:absolute;z-index:2;width:4px;height:4px;bottom:15%;animation:rise 2.4s linear infinite;opacity:0}
.stage.jump .hero{animation:jump .5s ease}.stage.jl .hero{animation:jump 1.1s ease infinite}
.bubble{position:absolute;z-index:5;top:6px;left:50%;transform:translateX(-50%);background:var(--surface-2);color:var(--text-primary);border:1.5px solid var(--border-stronger);border-radius:10px;padding:4px 10px;font-size:13px;white-space:nowrap;animation:fin .25s ease}
.bg-gym{background:linear-gradient(#cfd4dc,#aab1bd)}.bg-gym .ground{background:#6b6f78}
.bg-las{background:linear-gradient(#bfe3c7,#7bbf8a)}.bg-las .ground{background:#3B6D11}
.bg-zachod{background:linear-gradient(#f6a96b,#e2687e 70%,#8a3f78)}.bg-zachod .ground{background:#4a2240}
.bg-noc{background:radial-gradient(circle at 20% 25%,#fff 1px,transparent 1.5px),radial-gradient(circle at 70% 15%,#fff 1px,transparent 1.5px),radial-gradient(circle at 85% 45%,#fff 1px,transparent 1.5px),radial-gradient(circle at 40% 40%,#fff .8px,transparent 1.2px),linear-gradient(#0c1a3a,#24305e)}.bg-noc .ground{background:#101828}
.bg-kosmos{background:radial-gradient(circle at 78% 28%,#e8a33d 0 9%,transparent 9.5%),radial-gradient(circle at 15% 20%,#fff 1px,transparent 1.5px),radial-gradient(circle at 55% 12%,#fff 1px,transparent 1.5px),radial-gradient(circle at 30% 55%,#fff .8px,transparent 1.2px),linear-gradient(#1a0b33,#3d1f6b)}.bg-kosmos .ground{background:#6b5a8a}
.bg-lawa{background:linear-gradient(#3a0f0f,#8a2a12)}.bg-lawa .ground{background:linear-gradient(90deg,#ff7a18,#d43c0c,#ff7a18)}
.bg-plaza{background:linear-gradient(#9fd8f5,#d6f0fb 70%)}.bg-plaza .ground{background:#f2d79b}
.bg-arena{background:linear-gradient(#5c3b1e,#a8742e)}.bg-arena .ground{background:#d9b46a}
.bg-snieg{background:linear-gradient(#cfe6f7,#f4f9fd)}.bg-snieg .ground{background:#ffffff}
.bg-matrix{background:repeating-linear-gradient(90deg,rgba(60,220,90,.18) 0 2px,transparent 2px 9px),linear-gradient(#020a04,#06200d)}.bg-matrix .ground{background:#0b3b18}
.au-fire{background:radial-gradient(#ffcf6b,#ff6a1a 55%,transparent 70%)}
.au-ice{background:radial-gradient(#e7f6ff,#6bc3ff 55%,transparent 70%)}
.au-zap{background:radial-gradient(#fff6a8,#f2c400 55%,transparent 70%);animation:flick 1.1s steps(2) infinite!important}
.au-rainbow{background:conic-gradient(#ff5e5e,#ffbd3d,#f6f04b,#5ee07a,#4bb8f6,#9b6bff,#ff5e5e);animation:spin 3s linear infinite!important;opacity:.6!important}
.au-gold{background:radial-gradient(#fff1b8,#e7a72c 55%,transparent 70%)}
.au-shadow{background:radial-gradient(#9b6bff,#2b1450 55%,transparent 70%)}
.au-toxic{background:radial-gradient(#d4ff7a,#3bb54a 55%,transparent 70%)}
.au-love{background:radial-gradient(#ffd1e3,#ff5c9a 55%,transparent 70%)}
.au-storm{background:radial-gradient(#d7e2f0,#5a6b85 55%,transparent 70%);animation:flick 1.6s steps(3) infinite!important}
.au-night{background:radial-gradient(#5e6ad2,#121633 55%,transparent 70%)}
/* rarity */
.rar-c{--rc:#888780}.rar-r{--rc:#378ADD}.rar-e{--rc:#7F77DD}.rar-l{--rc:#EF9F27}
.item{position:relative;border:2px solid var(--border);border-radius:12px;padding:6px 4px 6px;background:var(--surface-1);display:flex;flex-direction:column;align-items:center;gap:4px;height:auto;width:100%;font-size:11px;line-height:1.25;text-align:center;color:var(--text-primary)}
.item.own{border-color:color-mix(in srgb,var(--rc) 55%,transparent)}
.item.eq{border-color:var(--rc);box-shadow:0 0 0 2px color-mix(in srgb,var(--rc) 35%,transparent);animation:pop .3s}
.item.lock{opacity:.6}
.item .lk{position:absolute;top:4px;right:5px;font-size:13px;color:var(--text-muted)}
.item .rd{position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:2px;background:var(--rc)}
.badge{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rc);border:2px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.badge.off{filter:grayscale(1);opacity:.45}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ovc{position:relative;background:var(--surface-2);border-radius:22px;padding:22px 20px 18px;width:min(380px,100%);max-height:86vh;overflow:auto;text-align:center;animation:zoom .45s cubic-bezier(.2,1.5,.4,1)}
.rays{position:absolute;left:50%;top:70px;width:240px;height:240px;margin-left:-120px;margin-top:-120px;background:repeating-conic-gradient(color-mix(in srgb,var(--rc,#EF9F27) 35%,transparent) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);pointer-events:none}
.cf{position:fixed;top:-12px;width:8px;height:12px;z-index:55;pointer-events:none;animation:fall linear forwards}
.shake{animation:shake .5s ease infinite}
.hit{animation:hit .45s ease}
.boom{animation:boom .9s ease forwards}
.dmg{position:absolute;z-index:6;font-size:22px;color:#E24B4A;font-weight:600;animation:up 1.4s ease-out both;pointer-events:none;text-shadow:0 1px 0 #fff}
.flame{display:inline-block;animation:flick 1.4s ease-in-out infinite;color:#D85A30}
.cmp{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:3/4;background:#000}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .tp{clip-path:inset(0 0 0 50%)}
.cmp .ln{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;box-shadow:0 0 6px rgba(0,0,0,.5)}
.thumb{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:10px;display:block;background:var(--surface-1)}
.ph{position:relative;border:2px solid transparent;border-radius:12px;padding:0;height:auto;background:none;overflow:hidden}
.ph.on{border-color:var(--purple)}
.ph .d{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 5px}
.sos{color:var(--text-danger);border-color:var(--border-danger)}
.dots{display:grid;gap:3px}
/* listy i huby */
.list{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:0 0 12px}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;height:auto;padding:12px 14px;border:none;border-radius:0;border-top:1px solid var(--border);background:transparent;text-align:left;color:var(--text-primary);justify-content:flex-start}
.rowlink:first-child{border-top:none}
.rowlink:active{transform:none;background:var(--surface-1)}
.ri{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sect{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;margin:18px 6px 6px}
.ptitle{display:flex;align-items:center;gap:10px;margin:2px 0 12px;min-height:38px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;height:auto;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);text-align:left;color:var(--text-primary);font-size:14px;width:100%}
.tile .lbl{font-size:11px}
.tile.on{border:2px solid var(--purple);background:var(--bg-purple)}
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:58;display:flex;align-items:center;gap:10px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border-strong);border-radius:14px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:bin .35s ease;max-width:92vw;cursor:pointer}
@keyframes bin{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes up{0%{opacity:0;transform:translateY(4px)}15%{opacity:1}100%{opacity:0;transform:translateY(-48px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{opacity:.85}50%{opacity:.35}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
@keyframes jump{30%{transform:translateY(-14px)}60%{transform:translateY(0)}75%{transform:translateY(-4px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-6px);filter:brightness(2.2)}40%{transform:translateX(6px)}60%{transform:translateX(-3px);filter:brightness(1.6)}}
@keyframes boom{0%{transform:scale(1);opacity:1;filter:none}40%{transform:scale(1.25);filter:brightness(3)}100%{transform:scale(.2) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function proteinCard(remP,rem){const F2=['Skyr naturalny','Twaróg chudy','Pierś z kurczaka','Tuńczyk w sosie własnym','Odżywka białkowa','Pierś z indyka','Jogurt grecki 2%','Krewetki','Serek wiejski','Tofu','Dorsz','Budyń proteinowy'],caps={'Odżywka białkowa':45,'Budyń proteinowy':200};let L=F2.map(n=>{const p=findP(n);let g=Math.ceil(remP/(p.p/100)/10)*10;g=Math.min(g,caps[n]||300);return{p,g,pr:p.p*g/100,k:p.k*g/100}});let fit=L.filter(x=>x.k<=Math.max(rem,0)+80);const tight=!fit.length;if(tight)fit=L;fit.sort((a,b)=>a.k/a.pr-b.k/b.pr);fit=fit.slice(0,4);

function mealsCard(rem,remP,t){const sl=SLOTS[curSlot()][2],mine=S.myMeals.map((m,i)=>Object.assign({mine:i},m));let src=U.mf==='mine'?mine:U.mf==='all'?MEALS.concat(mine):MEALS.filter(m=>m.sl.includes(U.mf));let fit=src.filter(m=>(!m.cheat||t.cheat)&&m.k<=rem+60);const mt=m=>m.mine!=null||(m.sl||'').includes(sl)?1:0,sc=(a,b)=>remP>15?b.p/b.k-a.p/a.k:Math.abs(rem*.6-a.k)-Math.abs(rem*.6-b.k);fit.sort((a,b)=>(U.mf==='all'?mt(b)-mt(a):0)||sc(a,b));if(t.cheat){const pz=fit.filter(m=>m.cheat);fit=pz.concat(fit.filter(m=>!m.cheat))}const tot2=fit.length;fit=fit.slice(0,U.mf==='all'?5:8);

function macroRow(n,v,max,col){return `<div style="margin-bottom:9px"><div class="row sb" style="font-size:13px;margin-bottom:3px"><span>${n}</span><span class="lbl">${r0(v)} / ${max} g</span></div>${bar(v/max*100,col)}</div>`}
function dayList(k){const L=S.foods[k]||[],y=S.foods[addD(k,-1)]||[];return SLOTS.map(([n,ic],si)=>{const it=L.map((x,i)=>Object.assign({i},x)).filter(x=>x.m===si),t=tot(k,si),hasY=y.some(x=>x.m===si);return `<div style="padding:8px 0;border-top:1px solid var(--border)"><div class="row sb"><span class="row" style="gap:6px;font-size:14px;font-weight:600"><i class="ti ${ic}" style="color:var(--text-secondary)"></i>${n}</span><span class="lbl">${it.length?r0(t.k)+' kcal · B '+r0(t.p)+' g':''}</span></div>${it.map(x=>`<div class="li nb" style="padding:6px 0"><div class="f1"><div style="font-size:14px">${esc(x.n)}</div><div class="lbl">${r0(x.g)} g · ${r0(x.k)} kcal · B ${r1(x.p)} · W ${r1(x.c)} · T ${r1(x.f)}</div></div><button class="ib" style="width:34px;height:34px" data-a="delf" data-x="${x.i}" aria-label="Usuń"><i class="ti ti-trash"></i></button></div>`).join('')}<div class="row wrap" style="gap:6px;margin-top:4px">${!it.length&&hasY?`<button class="chip sm" data-a="copyy" data-x="${si}"><i class="ti ti-copy"></i> Jak wczoraj</button>`:''}${it.length>=2?(U.saveMeal===si?`<input id="mmn" placeholder="Nazwa posiłku" style="height:34px;flex:1;min-width:140px"><button class="chip sm acc" data-a="savemm" data-x="${si}">Zapisz</button>`:`<button class="chip sm" data-a="savemmq" data-x="${si}"><i class="ti ti-bookmark"></i> Zapisz jako mój posiłek</button>`):''}${!it.length&&!hasY?`<span class="lbl">—</span>`:''}</div></div>`}).join('')}
function diet(){const k=dayK(),t=targets(k),tt=tot(k),rem=t.kcal-tt.k,remP=t.prot-tt.p,isT=k===T(),wk=Array.from({length:7},(_,i)=>addD(k,i-6)).filter(x=>(S.foods[x]||[]).length),avgK=wk.length?r0(wk.reduce((a,x)=>a+tot(x).k,0)/wk.length):0,avgP=wk.length?r0(wk.reduce((a,x)=>a+tot(x).p,0)/wk.length):0;

<div class="card"><div class="row" style="gap:16px">${ring(tt.k,t.kcal,'#7F77DD',118,11,`<div class="px" style="font-size:26px">${r0(Math.abs(rem))}</div><div class="lbl">${rem>=0?'kcal zostało':'kcal ponad'}</div>`)}<div class="f1">${macroRow('Białko',tt.p,t.prot,'#1D9E75')}${macroRow('Węglowodany',tt.c,t.carb,'#EF9F27')}${macroRow('Tłuszcze',tt.f,t.fat,'#D85A30')}</div></div><div class="row sb" style="margin-top:6px"><span class="lbl">Zjedzone ${r0(tt.k)} z ${t.kcal} kcal</span>${t.cheat?'<span class="pill w">cheat day +500</span>':''}</div></div>
<div class="card"><div class="h"><i class="ti ti-search"></i>Dodaj produkt</div><div class="row" style="gap:4px;margin-bottom:10px">${SLOTS.map(([n,ic],i)=>`<button class="chip sm ${curSlot()===i?'on':''}" style="flex:1;padding:0 4px" data-a="slot" data-x="${i}">${n}</button>`).join('')}</div><input id="q" placeholder="Skyr, ryż, jajko…" value="${esc(U.q)}" oninput="F.q(this.value)" autocomplete="off"><div id="res" class="row wrap" style="gap:6px;margin-top:10px">${resHTML()}</div><div id="selbox">${selHTML()}</div><button class="chip" style="margin-top:10px" data-a="custom"><i class="ti ${U.cust?'ti-x':'ti-plus'}"></i> ${U.cust?'Zamknij':'Własny produkt'}</button>${U.cust?customHTML():''}</div>

<div class="card"><div class="h"><i class="ti ti-heart"></i>Wdzięczność</div>${S.grat.length?S.grat.slice(0,15).map(g=>`<div class="li" style="align-items:flex-start"><span class="px lbl" style="width:40px">${fmtD(g.d)}</span><span class="f1" style="font-size:13px;line-height:1.5">${g.t.map(esc).join(' · ')}</span></div>`).join(''):empty('ti-heart','Jeszcze nic','Zapisuj 3 dobre rzeczy w zakładce Dziś.')}</div>
${S.worries.some(w=>w.done)?`<div class="card"><div class="h"><i class="ti ti-feather"></i>Odłożone zmartwienia</div>${S.worries.filter(w=>w.done).slice(0,15).map(w=>`<div class="li"><span class="f1" style="font-size:13px;color:var(--text-secondary);text-decoration:line-through">${esc(w.t)}</span><span class="lbl">${fmtD(w.done)}</span></div>`).join('')}</div>`:''}`}

function goalCur(g){const b=S.body.slice().sort((a,b)=>a.date<b.date?-1:1);switch(g.metric){case 'weight':{const x=b.filter(e=>e.w).pop();return x?x.w:+g.start}case 'waist':{const x=b.filter(e=>e.waist).pop();return x?x.waist:+g.start}case 'ex':{let m=+g.start||0;S.logs.forEach(l=>l.ex.forEach(e=>{if(e.n===g.ex)m=Math.max(m,bestOf(e.n,e.sets))}));return m}case 'ton':return r1(totalTon()/1000);case 'workouts':return S.logs.filter(l=>l.date>=g.created).length;case 'streak':return streak();default:{const l=(g.log||[]).slice(-1)[0];return l?+l.v:+g.start||0}}}
function goalProg(g){let cur=null,pct=0;if(g.type==='num'){cur=goalCur(g);const s=+g.start||0,t=+g.target;pct=t===s?(cur===t?1:0):clamp((cur-s)/(t-s),0,1)}else if(g.type==='check'){const n=(g.ms||[]).length;pct=n?(g.ms.filter(m=>m.d).length/n):0}else{const m=mon(T()),n=(g.hl||[]).filter(d=>d>=m).length;cur=n;pct=clamp(n/(+g.per||1),0,1)}
let exp=null,st=null;if(g.deadline&&g.type!=='habit'){const tt=Math.max(1,dd(g.created,g.deadline));exp=clamp(dd(g.created,T())/tt,0,1);st=pct>=1?'done':pct>=exp+.1?'ahead':pct>=exp-.05?'on':'behind'}return{cur,pct,exp,st}}
const ST={done:['s','Gotowe'],ahead:['s','Przed czasem'],on:['','Na dobrej drodze'],behind:['w','Opóźnienie']};
function goalCard(g){const ex=U.open==='g'+g.id,p=goalProg(g),area=AREAS.find(a=>a[0]===g.area)||AREAS[9],left=g.deadline?dd(T(),g.deadline):null,unit=g.unit||'',m=mon(T());
let body='';if(g.type==='num')body=`<div class="row sb" style="margin-top:8px"><span class="px" style="font-size:20px">${r1(p.cur).toLocaleString('pl-PL')}${unit?' '+esc(unit):''}</span><span class="lbl">start ${g.start}${unit?' '+esc(unit):''} → cel <b>${g.target}${unit?' '+esc(unit):''}</b></span></div>`;else if(g.type==='habit')body=`<div class="row sb" style="margin-top:8px"><span class="lbl">Ten tydzień: <b>${p.cur} / ${g.per}</b></span><button class="chip sm ${(g.hl||[]).includes(T())?'on':''}" data-a="ghab" data-x="${g.id}"><i class="ti ti-check"></i> Zrobione dziś</button></div><div class="row" style="gap:3px;margin-top:6px">${Array.from({length:8},(_,i)=>{const w=addD(m,-7*(7-i)),n=(g.hl||[]).filter(d=>d>=w&&d<addD(w,7)).length;return `<div class="f1" style="height:22px;border-radius:4px;background:${n>=g.per?'#1D9E75':n?'#9FE1CB':'var(--track)'}" title="${fmtD(w)}: ${n}"></div>`}).join('')}</div><div class="lbl" style="margin-top:2px">ostatnie 8 tygodni</div>`;
return `<div class="card"><div class="row sb"><span class="pill p"><i class="ti ${area[1]}"></i>${esc(g.area)}</span><div class="row" style="gap:4px">${p.st?`<span class="pill ${ST[p.st][0]}">${ST[p.st][1]}</span>`:''}<button class="ib" style="width:32px;height:32px" data-a="gedit" data-x="${g.id}" aria-label="Edytuj"><i class="ti ti-edit"></i></button></div></div><div style="font-size:16px;font-weight:600;margin-top:8px">${esc(g.title)}</div>${ex&&g.why?`<div class="lbl" style="font-style:italic">Bo: ${esc(g.why)}</div>`:''}${body}<div style="margin-top:8px;position:relative">${bar(p.pct*100,'#7F77DD',10)}${p.exp!=null?`<i style="position:absolute;top:-3px;left:${p.exp*100}%;width:2px;height:16px;background:var(--text-primary);opacity:.5" title="gdzie powinieneś być"></i>`:''}</div><div class="row sb lbl" style="margin-top:4px"><span>${r0(p.pct*100)}%${p.exp!=null?' · plan: '+r0(p.exp*100)+'%':''}</span><span>${left!=null?(left>=0?'zostało '+left+' '+plural(left,'dzień','dni','dni'):'termin minął'):''}</span></div>
${!ex?`${g.next?`<div class="lbl" style="margin-top:8px;color:var(--text-primary);font-size:13px"><i class="ti ti-arrow-right" style="color:#7F77DD"></i> ${esc(g.next)}</div>`:''}<button class="chip sm" style="margin-top:8px" data-a="open" data-x="g${g.id}"><i class="ti ti-chevron-down"></i> Etapy i postęp</button>`:''}${ex&&(g.ms||[]).length?`<div style="margin-top:8px">${g.ms.map((x,i)=>`<div class="li" style="padding:6px 0"><button class="chk ${x.d?'on':''}" style="width:26px;height:26px" data-a="gms" data-x="${g.id}" data-y="${i}" aria-label="Etap"><i class="ti ti-check" style="font-size:14px"></i></button><span class="f1" style="font-size:14px;${x.d?'text-decoration:line-through;color:var(--text-secondary)':''}">${esc(x.t)}</span></div>`).join('')}</div>`:''}
${ex?`<div class="row" style="gap:6px;margin-top:10px;align-items:center"><i class="ti ti-arrow-right" style="color:#7F77DD"></i><input placeholder="Najbliższy mały krok…" value="${esc(g.next||'')}" onchange="F.gnext('${g.id}',this.value)" style="height:36px;font-size:14px"></div>`:''}
${!ex?'':g.type==='num'&&g.metric==='manual'?(U.gp===g.id?`<div class="row" style="margin-top:8px"><input id="gpv" type="number" inputmode="decimal" placeholder="Nowa wartość" style="width:120px"><input id="gpn" placeholder="Notatka (opc.)"><button class="acc" data-a="gpsave" data-x="${g.id}">OK</button></div>`:`<button class="chip sm" style="margin-top:8px" data-a="gp" data-x="${g.id}"><i class="ti ti-plus"></i> Zapisz postęp</button>`):g.type==='num'?`<div class="lbl" style="margin-top:6px"><i class="ti ti-refresh"></i> Aktualizuje się automatycznie z ${g.metric==='ex'?'treningów':g.metric==='weight'||g.metric==='waist'?'pomiarów':'Twoich danych'}</div>`:''}
${ex&&(g.log||[]).length?`<div class="lbl" style="margin-top:6px">Ostatnio: ${g.log.slice(-3).reverse().map(x=>fmtD(x.d)+(x.v!=null&&x.v!==''?' → '+x.v:'')+(x.note?' ('+esc(x.note)+')':'')).join(' · ')}</div>`:''}
${ex?`<button class="chip sm" style="margin-top:8px" data-a="open" data-x="g${g.id}"><i class="ti ti-chevron-up"></i> Zwiń</button>`:''}${p.pct>=1?`<button class="acc" style="width:100%;margin-top:10px" data-a="gdone" data-x="${g.id}"><i class="ti ti-trophy"></i> Cel osiągnięty!</button>`:''}</div>`}
function goalForm(){const d=U.ge,isN=!S.goals.some(g=>g.id===d.id),exN=[...new Set(S.logs.flatMap(l=>l.ex.map(e=>e.n)).concat(Object.values(EX).flat()))];return `<div class="card" style="border:2px solid var(--border-accent)"><div class="h"><i class="ti ti-target-arrow"></i>${isN?'Nowy cel':'Edytuj cel'}</div>${isN?`<div class="lbl">Szybki start</div><div class="row wrap" style="gap:6px;margin:4px 0 10px">${GTPL.map((t,i)=>`<button class="chip sm" data-a="gtpl" data-x="${i}">${t[0]}</button>`).join('')}</div>`:''}
<div class="lbl">Co chcesz osiągnąć?</div><input value="${esc(d.title)}" placeholder="Np. Przysiad 100 kg do lata" oninput="F.ge('title',this.value)"><div class="g2" style="margin-top:8px"><div><div class="lbl">Obszar</div><select onchange="F.ge('area',this.value)">${AREAS.map(a=>`<option ${d.area===a[0]?'selected':''}>${a[0]}</option>`).join('')}</select></div><div><div class="lbl">Rodzaj</div><select onchange="F.gtype(this.value)">${[['num','Liczbowy'],['check','Etapy'],['habit','Nawyk tygodniowy']].map(([v,l])=>`<option value="${v}" ${d.type===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
${d.type==='num'?`<div class="lbl" style="margin-top:8px">Skąd brać wynik?</div><select onchange="F.gmet(this.value)">${METRICS.map(([v,l])=>`<option value="${v}" ${d.metric===v?'selected':''}>${l}</option>`).join('')}</select>${d.metric==='ex'?`<div class="lbl" style="margin-top:8px">Ćwiczenie</div><select onchange="F.gex(this.value)">${exN.map(n=>`<option ${d.ex===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}<div class="g3" style="margin-top:8px"><div><div class="lbl">Start</div><input type="number" inputmode="decimal" value="${d.start}" oninput="F.ge('start',this.value)"></div><div><div class="lbl">Cel</div><input type="number" inputmode="decimal" value="${d.target}" oninput="F.ge('target',this.value)"></div><div><div class="lbl">Jednostka</div><input value="${esc(d.unit)}" placeholder="kg" oninput="F.ge('unit',this.value)"></div></div>`:''}
${d.type==='habit'?`<div class="lbl" style="margin-top:8px">Ile razy w tygodniu?</div><input type="number" min="1" max="7" value="${d.per}" oninput="F.ge('per',this.value)">`:''}
${d.type!=='habit'?`<div class="lbl" style="margin-top:8px">Termin (opcjonalnie)</div><input type="date" value="${d.deadline||''}" min="${T()}" onchange="F.ge('deadline',this.value)">`:''}
<div class="lbl" style="margin-top:8px">Dlaczego to dla Ciebie ważne?</div><input value="${esc(d.why)}" placeholder="Prawdziwy powód trzyma, gdy motywacja spada" oninput="F.ge('why',this.value)">
<div class="lbl" style="margin-top:8px">Etapy po drodze ${d.type==='check'?'':'(opcjonalnie)'}</div>${(d.ms||[]).map((m,i)=>`<div class="row" style="margin-top:4px"><input value="${esc(m.t)}" oninput="F.gm(${i},this.value)" style="height:36px"><button class="ib" style="width:36px;height:36px" data-a="gmdel" data-x="${i}" aria-label="Usuń etap"><i class="ti ti-x"></i></button></div>`).join('')}<button class="chip sm" style="margin-top:6px" data-a="gmadd"><i class="ti ti-plus"></i> Etap</button>
<div class="lbl" style="margin-top:8px">Najbliższy mały krok</div><input value="${esc(d.next)}" placeholder="Coś na ten tydzień, co zajmie max 30 minut" oninput="F.ge('next',this.value)">
<div id="geerr" class="lbl" style="color:var(--text-danger);margin-top:6px"></div><div class="row" style="margin-top:10px"><button class="pri" style="flex:1" data-a="gsave">Zapisz cel</button><button data-a="gcancel">Anuluj</button></div>${!isN?`<button class="danger" style="width:100%;margin-top:8px" data-a="gdel">${U.cc?'Kliknij jeszcze raz, żeby usunąć':'Usuń cel'}</button>`:''}
<details style="margin-top:10px"><summary class="lbl" style="cursor:pointer">Jak dobrze ustawić cel?</summary><div class="note" style="margin-top:6px">Konkretny („przysiad 100 kg”, nie „być silniejszym”), mierzalny, realny, ważny dla Ciebie i z terminem. Najważniejsze jest jednak to, co robisz co tydzień — dlatego każdy cel ma „najbliższy mały krok”.</div></details></div>`}
function reviewCard(){const m=mon(T()),r=S.reviews[m],ws=weekSum(m),open=U.open==='rev'||pd(T()).getDay()===0;return `<div class="card"><button class="acc-b" data-a="open" data-x="rev"><span class="h" style="margin:0"><i class="ti ti-calendar-check"></i>Przegląd tygodnia</span>${r?'<span class="pill s"><i class="ti ti-check"></i> zrobiony</span>':`<i class="ti ${open?'ti-chevron-up':'ti-chevron-down'}"></i>`}</button>${open||r?`<div class="g3" style="margin-top:10px"><div class="mc"><div class="lbl">Treningi</div><div class="px" style="font-size:18px">${ws.w}</div></div><div class="mc"><div class="lbl">Śr. kcal</div><div class="px" style="font-size:18px">${ws.kcal||'—'}</div></div><div class="mc"><div class="lbl">Nawyki</div><div class="px" style="font-size:18px">${ws.hab}%</div></div><div class="mc"><div class="lbl">Tonaż</div><div class="px" style="font-size:18px">${fmtT(ws.ton)}</div></div><div class="mc"><div class="lbl">Nastrój</div><div class="px" style="font-size:18px">${ws.mood||'—'}</div></div><div class="mc"><div class="lbl">Boss</div><div class="px" style="font-size:18px">${ws.boss?'✓':'—'}</div></div></div>${[['good','Co poszło dobrze?'],['bad','Co przeszkodziło?'],['focus','Na czym skupiam się w przyszłym tygodniu?']].map(([k,l])=>`<div class="lbl" style="margin-top:10px">${l}</div><textarea id="rv_${k}" rows="2">${esc(r?r[k]:'')}</textarea>`).join('')}<button class="pri" style="width:100%;margin-top:10px" data-a="review">${r?'Zaktualizuj':'Zapisz przegląd (+40 XP)'}</button>`:`<div class="lbl" style="margin-top:4px">5 minut w niedzielę: co działa, co nie, na czym się skupić.</div>`}</div>`}
function celeV(){if(U.ge)return goalForm();const act=S.goals.filter(g=>!g.done&&!g.arch),done=S.goals.filter(g=>g.done);return `<div class="card"><div class="h"><i class="ti ti-id"></i>Kim się staję</div><div class="lbl" style="margin-bottom:8px">Nawyki trzymają się lepiej, gdy są częścią tożsamości. Dokończ zdanie: „Jestem osobą, która…”</div>${S.identity.map((x,i)=>`<div class="li"><i class="ti ti-point" style="color:#7F77DD"></i><span class="f1" style="font-family:var(--font-voice);font-size:16px">${esc(x)}</span><button class="ib" style="width:32px;height:32px;border:none" data-a="iddel" data-x="${i}" aria-label="Usuń"><i class="ti ti-x"></i></button></div>`).join('')}${S.identity.length<5?`<div class="row" style="margin-top:6px"><input id="idn" placeholder="…trenuje, nawet gdy nie ma ochoty"><button data-a="idadd">Dodaj</button></div>`:''}</div>

function cmpChart(pts){if(pts.length<2)return '';const W=340,H=150,pl=6,pb=18,pt=14,mx=Math.max(...pts.map(p=>p.y))||1,X=i=>pl+i*(W-2*pl)/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-v/mx);const L=(f,c,w)=>`<polyline points="${pts.map((p,i)=>X(i).toFixed(1)+','+Y(f(p)).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wzrost oszczędności"><polygon points="${X(0)},${H-pb} ${pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')} ${X(pts.length-1)},${H-pb}" fill="#1D9E75" fill-opacity=".12"/>${L(p=>p.y,'#1D9E75',3)}${L(p=>p.d==null?p.y:p.d,'#B4B2A9',2)}<text x="${pl}" y="${H-3}" font-size="11" style="fill:var(--text-secondary)">dziś</text><text x="${W-pl}" y="${H-3}" text-anchor="end" font-size="11" style="fill:var(--text-secondary)">za ${pts.length-1} lat</text></svg><div class="row lbl" style="gap:12px"><span><i style="display:inline-block;width:10px;height:3px;background:#1D9E75;vertical-align:middle"></i> wartość</span><span><i style="display:inline-block;width:10px;height:3px;background:#B4B2A9;vertical-align:middle"></i> same wpłaty</span></div>`}
function inwestV(){const c=U.calc,res=compound(c.s,c.m,c.y,c.r),h=U.hcost,per={d:365,w:52,m:12}[h.p],yr=(+h.a||0)*per,fv=compound(0,yr/12,10,5).v;
return `<div class="card flat"><div class="row" style="gap:10px;align-items:flex-start"><i class="ti ti-info-circle" style="font-size:20px;color:var(--text-secondary)"></i><div class="note">To materiały edukacyjne, nie porada inwestycyjna. Nie jestem doradcą finansowym — decyzje podejmujesz sam, najlepiej po sprawdzeniu aktualnych warunków u źródła.</div></div></div>

function nextLandmark(){const d=pd(T()),dw=d.getDay(),day=d.getDate(),toMon=(8-dw)%7||7,last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),toM=last-day+1;if(dw===1)return{now:true,t:'Dziś poniedziałek — nowy tydzień, czysta karta.'};if(day===1)return{now:true,t:'Dziś pierwszy dzień miesiąca — idealny moment na nowy start.'};return toM<toMon?{now:false,t:`Za ${toM} ${plural(toM,'dzień','dni','dni')} nowy miesiąc. Zaplanuj, co wtedy zaczniesz.`}:{now:false,t:`Za ${toMon} ${plural(toMon,'dzień','dni','dni')} poniedziałek. Zaplanuj jedną rzecz na nowy tydzień.`}}

function twoMin(){const L=[],np=nextPlan(),g=S.goals.find(x=>!x.done&&!x.arch&&x.next),one=(S.mot.one[T()]||{});if(one.t&&!one.done)L.push('Pierwsze 2 minuty: '+one.t);if(np)L.push('Ubierz strój treningowy i zrób rozgrzewkę ('+np.name+')');if(g)L.push('Krok w celu: '+g.next);L.push('Zrób 10 cofnięć brody i 10 przysiadów');L.push('Wpisz jeden posiłek albo wydatek');L.push('Otwórz notatki i napisz pierwsze zdanie');return L.slice(0,4)}
